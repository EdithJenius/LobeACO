name: lobehub-local
services:
  lobe:
    image: lobehub/lobehub:2.3.3
    ports: ['127.0.0.1:3210:3210']
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgresql:5432/lobechat
      INTERNAL_APP_URL: http://localhost:3210
      S3_INTERNAL_ENDPOINT: http://rustfs:9000
      S3_BUCKET: lobe
      S3_ENABLE_PATH_STYLE: '1'
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      S3_SET_ACL: '0'
      LLM_VISION_IMAGE_USE_BASE64: '1'
      REDIS_URL: redis://redis:6379
      REDIS_PREFIX: lobechat
      REDIS_TLS: '0'
      SEARXNG_URL: http://searxng:8080
      ENABLE_AGENT_GATEWAY: '1'
      AGENT_GATEWAY_INTERNAL_URL: http://gateway:8787
      AGENT_GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN}
      DEVICE_GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN}
    depends_on:
      postgresql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rustfs-init: {condition: service_completed_successfully}
    restart: unless-stopped
  gateway:
    image: ghcr.io/lobehub/lobehub-gateway:0.5.0
    ports: ['127.0.0.1:8787:8787', '127.0.0.1:8788:8788']
    environment:
      SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN}
      JWKS_PUBLIC_KEY: ${JWKS_PUBLIC_KEY}
      LOBE_API_BASE_URL: http://lobe:3210
    restart: unless-stopped
  postgresql:
    image: paradedb/paradedb:latest-pg17
    environment:
      POSTGRES_DB: lobechat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ['postgres', '-c', 'shared_preload_libraries=pg_search,pg_cron,pg_stat_statements']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -h 127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1000 --appendonly yes
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  rustfs:
    image: rustfs/rustfs:latest
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    environment:
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    command: ['/data']
    volumes: ['rustfs-data:/data']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:9000/health >/dev/null 2>&1 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  rustfs-init:
    image: rustfs/rc:latest
    depends_on:
      rustfs: {condition: service_healthy}
    volumes: ['./bucket.config.json:/bucket.config.json:ro']
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        rc alias set rustfs http://rustfs:9000 "$${RUSTFS_ACCESS_KEY}" "$${RUSTFS_SECRET_KEY}"
        rc mb rustfs/lobe --ignore-existing
        rc anonymous set-json /bucket.config.json rustfs/lobe
        printf '%s' '<CORSConfiguration><CORSRule><AllowedOrigin>http://localhost:3210</AllowedOrigin><AllowedMethod>GET</AllowedMethod><AllowedMethod>PUT</AllowedMethod><AllowedMethod>HEAD</AllowedMethod><AllowedHeader>*</AllowedHeader><ExposeHeader>ETag</ExposeHeader><MaxAgeSeconds>3600</MaxAgeSeconds></CORSRule></CORSConfiguration>' | rc bucket cors set rustfs/lobe -
    restart: 'no'
  searxng:
    image: searxng/searxng:latest
    volumes: ['./searxng-settings.yml:/etc/searxng/settings.yml:ro']
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  rustfs-data:
