<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的店铺账号</title>
<style>*{box-sizing:border-box}body{background:#101622;color:#edf2fb;font:16px system-ui;max-width:1120px;margin:40px auto;padding:24px}h1{font-size:34px}p{color:#aebcd1;line-height:1.7}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px}.card,.panel{background:#1b2536;padding:22px;border-radius:16px;border:1px solid #34435a}.panel{margin:20px 0}button{background:#ff713b;color:#fff;border:0;border-radius:8px;padding:11px 15px;margin:7px 7px 0 0;cursor:pointer}button.secondary{background:#34435a}button:disabled{opacity:.4}input,select{background:#101622;color:#fff;border:1px solid #52617b;border-radius:7px;padding:11px;margin:6px;max-width:100%}label{display:block;color:#bac9dd;margin:8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#172132;padding:18px;border-radius:12px;max-height:260px;overflow:auto}.pill{color:#7ce0b5;font-size:13px}.meta{font-size:12px;color:#9fb0cb;overflow-wrap:anywhere}</style>
<a href="http://localhost:3210/experts" style="color:#7ce0b5">返回我的专家</a><p>LobeHub 本机连接码：<strong>__PAIR_CODE__</strong>（仅在自己的 LobeHub 中填写）</p><h1>我的店铺账号</h1><p>支持淘宝、天猫、拼多多、1688 和抖店。每家店使用独立登录环境，同一平台可以添加多家店铺。首次登录在普通窗口中完成，关闭后再连接后台核对实际店名。</p>
<section class="panel"><form id="create"><label>平台<select id="platform" aria-label="平台"></select></label><label>新账号名称<input id="name" maxlength="80" placeholder="例如：淘宝二店" required><button>创建环境</button></label></form></section>
<label>筛选平台<select id="filter"><option value="">全部平台</option></select></label><div class="cards" id="cards"></div><p id="status"></p>
<section class="panel"><h2>加密备份与恢复</h2><p>导出会关闭所选账号的自动化窗口；普通登录窗口请先手动关闭。备份密码仅在本地处理，无法找回。导入按备份中的平台创建新环境，兼容原有淘宝备份。</p><form id="backup"><label>导出账号<select id="account"></select></label><label>备份密码<input type="password" id="password" minlength="12" maxlength="1024" autocomplete="off" placeholder="至少12个字符" required></label><label>确认密码（导出时填写）<input type="password" id="repeat" autocomplete="off"></label><button name="action" value="export">加密导出</button><hr><label>导入文件<input id="file" type="file" accept=".tbprofile"></label><label>恢复后名称<input id="restoreName" maxlength="80" placeholder="可选"></label><button name="action" value="import" class="secondary">导入到新环境</button></form><p class="meta">单个备份上限64MB。跨机器或内核恢复可能需要重新登录；这不是 Codex 内置浏览器的会话导出。</p></section>
<pre id="output" role="status">打开普通登录窗口后，请手动登录并关闭窗口，再连接后台。</pre>
<script>
const token='__TOKEN__',$=s=>document.querySelector(s);let last='',busy=false,platformsReady=false;
async function api(route,data){const r=await fetch(route,{method:data?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});const result=await r.json();if(!r.ok)throw Error(result.error||'请求失败');return result}
async function refresh(){try{const s=await api('/status');if(!platformsReady){for(const p of s.platforms){$('#platform').add(new Option(p.name,p.id));$('#filter').add(new Option(p.name,p.id));}$('#platform').value='taobao';platformsReady=true;}$('#status').textContent='当前选择：'+(s.profiles.find(p=>p.id===s.active)?.name||'无');const next=JSON.stringify([s.profiles,s.open,s.manual,$('#filter').value]);if(next===last)return;last=next;const selection=$('#account').value;$('#cards').replaceChildren();$('#account').replaceChildren();for(const p of s.profiles){const option=new Option(p.name,p.id);$('#account').add(option);if($('#filter').value&&p.platform!==$('#filter').value)continue;const card=document.createElement('section');card.className='card';const h=document.createElement('h2');h.textContent=p.name;const status=document.createElement('p');status.className='pill';status.textContent=p.restoreError?'恢复失败':s.manual.includes(p.id)?'手动登录窗口已打开':s.open.includes(p.id)?'已连接 · 登录待核对':'已保存 · 登录待核对';const meta=document.createElement('p');meta.className='meta';meta.textContent=p.id;const platform=document.createElement('p');platform.className='pill';platform.textContent=s.platforms.find(x=>x.id===p.platform)?.name||p.platform;card.append(platform,h,status,meta);for(const [action,label] of [['manual_login','普通窗口登录'],['open','连接后台'],['switch','切换账号'],['inspect','检查页面'],['close','关闭并保存']]){const b=document.createElement('button');b.textContent=label;b.className=action==='manual_login'?'':'secondary';b.disabled=!!p.restoreError;b.onclick=()=>run(async()=>{const r=await api('/command',{account:p.id,action});return action==='close'?'窗口已关闭，登录环境保存在本机。':r.message||JSON.stringify(r,null,2)});card.append(b)}
if(p.platform==='taobao' && !p.restoreError){
  const label=document.createElement('label');label.textContent='只读报表';
  const select=document.createElement('select');
  for(const [kind,name] of [['products','我的商品'],['quality','商品质量分'],['finance','财务总览'],['daily','查询核心日报'],['syncDaily','下载近30天原表']])select.add(new Option(name,kind));
  const button=document.createElement('button');button.className='secondary';button.textContent='读取报表';
  button.onclick=()=>run(async()=>JSON.stringify((await api('/collections',{action:'report',account:p.id,kind:select.value})).report,null,2));
  label.append(select,button);card.append(label);
}
$('#cards').append(card)}if([...$('#account').options].some(o=>o.value===selection))$('#account').value=selection;}catch(e){$('#status').textContent='服务连接失败：'+e.message}}
async function run(fn){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);$('#output').textContent='处理中…';try{$('#output').textContent=await fn()}catch(e){$('#output').textContent=e.message}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false);last='';await refresh()}}
$('#create').onsubmit=e=>{e.preventDefault();run(async()=>{const r=await api('/profiles',{action:'create',name:$('#name').value,platform:$('#platform').value});$('#name').value='';$('#filter').value='';return '已创建 '+r.name})};
$('#backup').onsubmit=e=>{e.preventDefault();const mode=e.submitter.value;run(async()=>{const password=$('#password').value;try{if(mode==='export'){if(password!==$('#repeat').value)throw Error('两次密码不一致');const r=await api('/profiles',{action:'export',account:$('#account').value,password});const bytes=Uint8Array.from(atob(r.data),c=>c.charCodeAt(0));const url=URL.createObjectURL(new Blob([bytes],{type:'application/octet-stream'}));const a=document.createElement('a');a.href=url;a.download=r.filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);return '加密备份已生成并开始下载。源 Profile 保留。'}const file=$('#file').files[0];if(!file||file.size>64*1024*1024)throw Error('请选择不超过64MB的备份');const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});const r=await api('/profiles',{action:'import',data,password,name:$('#restoreName').value});return '已恢复为 '+r.name+'，请连接后台核对登录。'}finally{$('#password').value='';$('#repeat').value=''}})};
$('#filter').onchange=()=>{last='';refresh()};
refresh();setInterval(()=>{if(!busy)refresh()},5000);
</script></html>
